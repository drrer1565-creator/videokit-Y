name: Performance Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'perf/v4.5.0'
    paths:
      - '.github/perf-build-trigger'

permissions:
  contents: read

env:
  PYTHON_EMBED_VERSION: '3.11.9'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup embedded Python
        shell: pwsh
        run: |
          $pythonUrl = "https://www.python.org/ftp/python/${{ env.PYTHON_EMBED_VERSION }}/python-${{ env.PYTHON_EMBED_VERSION }}-embed-amd64.zip"
          Invoke-WebRequest -Uri $pythonUrl -OutFile "python-embed.zip"
          New-Item -ItemType Directory -Force -Path "vendor/windows/python"
          Expand-Archive -Path "python-embed.zip" -DestinationPath "vendor/windows/python" -Force
          Remove-Item "python-embed.zip"

          $pthFile = "vendor/windows/python/python311._pth"
          @"
          python311.zip
          .
          Lib/site-packages
          import site
          "@ | Set-Content $pthFile -Encoding UTF8

          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "vendor/windows/python/get-pip.py"
          New-Item -ItemType Directory -Force -Path "vendor/windows/python/Lib/site-packages"
          & "vendor/windows/python/python.exe" "vendor/windows/python/get-pip.py" --no-warn-script-location
          & "vendor/windows/python/python.exe" -m pip install -r requirements-edge.txt yt-dlp requests --target "vendor/windows/python/Lib/site-packages" --no-warn-script-location

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-temp" -Force
          New-Item -ItemType Directory -Force -Path "vendor/windows/ffmpeg/bin"
          $extractedDir = Get-ChildItem -Path "ffmpeg-temp" -Directory | Select-Object -First 1
          Copy-Item "$($extractedDir.FullName)/bin/ffmpeg.exe" "vendor/windows/ffmpeg/bin/"
          Copy-Item "$($extractedDir.FullName)/bin/ffprobe.exe" "vendor/windows/ffmpeg/bin/"
          Copy-Item "$($extractedDir.FullName)/LICENSE.txt" "vendor/windows/ffmpeg/"
          Remove-Item "ffmpeg.zip"
          Remove-Item -Recurse -Force "ffmpeg-temp"

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Package Windows performance build
        shell: pwsh
        run: |
          npx electron-builder --win --x64 --publish never '-c.win.artifactName=VideoKit-Performance-Test-${version}.${ext}'

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: VideoKit-Performance-Windows
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
          retention-days: 14
