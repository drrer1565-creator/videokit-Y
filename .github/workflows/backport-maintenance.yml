name: Validate upstream 4.4.42 backports
# Branch-only validation workflow; remove before merge.

on:
  push:
    branches: ['feature/upstream-4.4.42-security-backports']
    paths: ['.github/workflows/backport-maintenance.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/upstream-4.4.42-security-backports

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Normalize dependency and action pins
        run: node scripts/apply-upstream-4.4.42-repo-maintenance.cjs

      - name: Commit normalized lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "security: align lockfile with 4.4.49 and upstream pins"
            git push origin HEAD:feature/upstream-4.4.42-security-backports
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build frontend
        run: npm run build
