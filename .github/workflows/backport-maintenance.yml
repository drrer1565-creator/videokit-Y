name: Validate upstream 4.4.42 backports
# Branch-only validation workflow; remove before merge.

on:
  push:
    branches: ['feature/upstream-4.4.42-security-backports']
    paths: ['.github/workflows/backport-maintenance.yml']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/upstream-4.4.42-security-backports

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Normalize generated backport sources
        shell: bash
        run: |
          node scripts/apply-upstream-4.4.42-repo-maintenance.cjs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-upstream-4.4.42-security-backports.js')
          s = p.read_text()
          old = "const localRequire = (modulePath) => `require(${JSON.stringify(modulePath)})`;"
          new = "const localRequire = (modulePath) => \"require(\" + \"'\" + modulePath + \"'\" + \")\";"
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
          PY

      - name: Commit normalized sources
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json scripts/apply-upstream-4.4.42-security-backports.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json scripts/apply-upstream-4.4.42-security-backports.js
            git commit -m "fix: normalize security backport sources"
            git push origin HEAD:feature/upstream-4.4.42-security-backports
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Build frontend
        run: npm run build
