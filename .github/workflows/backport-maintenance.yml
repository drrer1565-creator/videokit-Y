name: Backport repository maintenance

on:
  push:
    branches: ['feature/upstream-4.4.42-security-backports']
    paths: ['.github/workflows/backport-maintenance.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/upstream-4.4.42-security-backports

      - name: Apply upstream maintenance pins
        run: node scripts/apply-upstream-4.4.42-repo-maintenance.cjs

      - name: Commit generated maintenance changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No maintenance changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/build.yml .github/workflows/codeql.yml .github/workflows/main-regression.yml .github/workflows/release-windows.yml
          git commit -m "security: apply upstream 4.4.42 dependency and action pins"
          git push origin HEAD:feature/upstream-4.4.42-security-backports
