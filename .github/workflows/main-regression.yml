name: Main regression CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Sync package version
        run: npm version 4.4.52 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test

      - name: Run v4.4.55 batch import regression
        run: node --test tests/batch-import-performance-v4.4.55-regression.test.js

      - name: Build frontend
        run: npm run build
