name: v4.4.51 release prep

on:
  push:
    branches: ['release/v4.4.51']
    paths:
      - '.github/workflows/v4.4.51-release-prep.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release/v4.4.51
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set package and lockfile version
        run: npm version 4.4.51 --no-git-tag-version --allow-same-version

      - name: Update version regression
        shell: node {0}
        run: |
          const fs = require('fs');
          const file = 'tests/reels-4.4.43-regression.test.js';
          const before = fs.readFileSync(file, 'utf8');
          const after = before.replaceAll('4.4.49', '4.4.51');
          if (before === after) throw new Error(`Expected 4.4.49 marker not found in ${file}`);
          fs.writeFileSync(file, after);

      - name: Commit release preparation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git add -f tests/reels-4.4.43-regression.test.js
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare v4.4.51 package metadata"
          git push origin HEAD:release/v4.4.51
