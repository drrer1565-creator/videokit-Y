name: v4.4.52 connected-fit validation

on:
  push:
    branches: ['fix/v4.4.52-connected-fit-snap']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply subtitle display patches
        run: |
          node scripts/apply-v4.4.51-subtitle-display.js
          node scripts/apply-v4.4.52-connected-fit-snap.js

      - name: Run existing regression suite
        run: npm test

      - name: Run v4.4.52 connected-fit regressions
        run: node --test tests/subtitle-display-v4.4.52-regression.test.js

      - name: Build frontend
        run: npm run build
